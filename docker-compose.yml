version: "3.8"

services:
  kafka:
    image: apache/kafka:3.7.0
    platform: linux/arm64
    hostname: kafka
    container_name: supply-chain-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - supply-chain-network

  gateway:
    build:
      context: ./gateway-go
      dockerfile: Dockerfile
    container_name: supply-chain-gateway
    ports:
      - "8080:8080" # Main API
      - "9100:9100" # Metrics
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_ENV: dev
      PORT: 8080
      PROM_PORT: 9100
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Nginx Load Balancer for Enrichment Services
  nginx-lb:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: supply-chain-nginx-lb
    ports:
      - "8085:80" # Load balancer endpoint
    depends_on:
      enrichment-1:
        condition: service_healthy
      enrichment-2:
        condition: service_healthy
      enrichment-3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Enrichment Service Instance 1
  enrichment-1:
    build:
      context: ./enrichment-py
      dockerfile: Dockerfile
    container_name: supply-chain-enrichment-1
    ports:
      - "8082:8082"
      - "9102:9102" # Prometheus metrics
    environment:
      PORT: 8082
      PROM_PORT: 9102
      SERVICE_ENV: production
      INSTANCE_ID: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Enrichment Service Instance 2
  enrichment-2:
    build:
      context: ./enrichment-py
      dockerfile: Dockerfile
    container_name: supply-chain-enrichment-2
    ports:
      - "8086:8082"
      - "9103:9102" # Prometheus metrics
    environment:
      PORT: 8082
      PROM_PORT: 9102
      SERVICE_ENV: production
      INSTANCE_ID: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Enrichment Service Instance 3
  enrichment-3:
    build:
      context: ./enrichment-py
      dockerfile: Dockerfile
    container_name: supply-chain-enrichment-3
    ports:
      - "8087:8082"
      - "9104:9102" # Prometheus metrics
    environment:
      PORT: 8082
      PROM_PORT: 9102
      SERVICE_ENV: production
      INSTANCE_ID: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - supply-chain-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    container_name: supply-chain-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supply-chain-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: supply-chain-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - supply-chain-network

  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    container_name: supply-chain-redis-ui
    ports:
      - "8084:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network

  # PostgreSQL for alert history
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: supply-chain-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: supply_chain_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supply_chain_user -d supply_chain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Lightweight stream processor (disabled - using Flink instead)
  # stream-processor:
  #   build:
  #     context: ./stream-processor
  #     dockerfile: Dockerfile
  #   platform: linux/arm64
  #   container_name: supply-chain-stream-processor
  #   environment:
  #     KAFKA_BOOTSTRAP: kafka:9092
  #     REDIS_URL: redis://redis:6379/0
  #     ENRICHMENT_ENDPOINT: http://enrichment:8082
  #     SERVICE_ENV: production
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     enrichment:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - supply-chain-network

  # Flink JobManager (Master)
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    platform: linux/arm64
    container_name: supply-chain-flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081" # Flink Web UI
      - "6123:6123" # RPC
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    command: jobmanager
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Flink TaskManager (Worker) - Instance 1
  flink-taskmanager-1:
    image: flink:1.18.1-scala_2.12-java11
    platform: linux/arm64
    container_name: supply-chain-flink-taskmanager-1
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    command: taskmanager
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Flink TaskManager (Worker) - Instance 2
  flink-taskmanager-2:
    image: flink:1.18.1-scala_2.12-java11
    platform: linux/arm64
    container_name: supply-chain-flink-taskmanager-2
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
    command: taskmanager
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Flink Job Submitter (Custom processor that submits job to cluster)
  flink-processor:
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: supply-chain-flink-processor
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://supply_chain_user:changeme@postgres:5432/supply_chain
      # Batch processing configuration for high throughput
      ENRICHMENT_BATCH_SIZE: "10"  # Articles per batch (10-50 recommended)
      ENRICHMENT_BATCH_TIMEOUT_MS: "1000"  # Max wait time before flushing batch (ms)
      USE_MOCK_ENRICHMENT: "false" # Use real enrichment through load balancer
      ENRICHMENT_ENDPOINT: http://nginx-lb # Point to nginx load balancer
      SERVICE_ENV: production
      FLINK_PARALLELISM: 4
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: 8081
      SLACK_WEBHOOK_URL: "disabled" # Set to actual webhook URL to enable alerts
      SLACK_CHANNEL: "#supply-chain-alerts"
      ALERT_COOLDOWN_MINUTES: "30"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nginx-lb:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints

  # Flink Shock Detector (Alternative: shock-only detection with async)
  # To use: Stop flink-processor and start this instead
  # flink-shock-detector:
  #   build:
  #     context: ./flink-processor
  #     dockerfile: Dockerfile
  #   platform: linux/arm64
  #   container_name: supply-chain-flink-shock-detector
  #   environment:
  #     KAFKA_BOOTSTRAP: kafka:9092
  #     REDIS_URL: redis://redis:6379/0
  #     POSTGRES_URL: postgresql://supply_chain_user:changeme@postgres:5432/supply_chain
  #     USE_MOCK_ENRICHMENT: "false"
  #     ENRICHMENT_ENDPOINT: http://nginx-lb
  #     SERVICE_ENV: production
  #     FLINK_PARALLELISM: 4
  #     FLINK_JOBMANAGER_HOST: flink-jobmanager
  #     FLINK_JOBMANAGER_PORT: 8081
  #     # Shock detection configuration
  #     FLINK_JOB_MODE: "shock"  # Run shock detection job instead of standard
  #     SHOCK_SENTIMENT_THRESHOLD: "-0.5"  # Sentiment below this = shock
  #     SHOCK_ALERT_COUNT: "3"  # Alert if 3+ shocks in window
  #     ASYNC_CAPACITY: "200"  # 200 concurrent async enrichment requests
  #     SLACK_WEBHOOK_URL: "disabled"
  #     SLACK_CHANNEL: "#supply-chain-shocks"
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     nginx-lb:
  #       condition: service_healthy
  #     flink-jobmanager:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - supply-chain-network
  #   volumes:
  #     - flink-checkpoints:/tmp/flink-checkpoints
  #     - flink-savepoints:/tmp/flink-savepoints

volumes:
  kafka-data:
  redis-data:
  postgres-data:
  flink-checkpoints:
  flink-savepoints:

networks:
  supply-chain-network:
    driver: bridge
