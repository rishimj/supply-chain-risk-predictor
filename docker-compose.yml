version: "3.8"

services:
  kafka:
    image: apache/kafka:3.7.0
    platform: linux/arm64
    hostname: kafka
    container_name: supply-chain-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - supply-chain-network

  gateway:
    build:
      context: ./gateway-go
      dockerfile: Dockerfile
    container_name: supply-chain-gateway
    ports:
      - "8080:8080" # Main API
      - "9100:9100" # Metrics
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_ENV: dev
      PORT: 8080
      PROM_PORT: 9100
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - supply-chain-network

  enrichment:
    build:
      context: ./enrichment-py
      dockerfile: Dockerfile
    container_name: supply-chain-enrichment
    ports:
      - "8082:8082"
      - "9102:9102" # Prometheus metrics
    environment:
      PORT: 8082
      PROM_PORT: 9102
      SERVICE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - supply-chain-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    container_name: supply-chain-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: supply-chain-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: supply-chain-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - supply-chain-network

  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    container_name: supply-chain-redis-ui
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network

  # Lightweight stream processor (disabled - using Flink instead)
  # stream-processor:
  #   build:
  #     context: ./stream-processor
  #     dockerfile: Dockerfile
  #   platform: linux/arm64
  #   container_name: supply-chain-stream-processor
  #   environment:
  #     KAFKA_BOOTSTRAP: kafka:9092
  #     REDIS_URL: redis://redis:6379/0
  #     ENRICHMENT_ENDPOINT: http://enrichment:8082
  #     SERVICE_ENV: production
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     enrichment:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - supply-chain-network

  # Flink processor for advanced stream processing
  flink-processor:
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: supply-chain-flink
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
      USE_MOCK_ENRICHMENT: "true"  # Start with mock for testing
      ENRICHMENT_ENDPOINT: http://enrichment:8082
      SERVICE_ENV: production
      FLINK_PARALLELISM: 2
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      enrichment:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - supply-chain-network
    ports:
      - "8083:8080"  # Expose Flink web UI if available

volumes:
  kafka-data:
  redis-data:

networks:
  supply-chain-network:
    driver: bridge
