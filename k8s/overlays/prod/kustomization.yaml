apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namePrefix: prod-

patches:
  # Increase replicas for production
  - target:
      kind: Deployment
      name: enrichment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  
  - target:
      kind: Deployment
      name: flink-taskmanager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  
  # Increase storage for production
  - target:
      kind: PersistentVolumeClaim
      name: flink-checkpoints-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi
  
  - target:
      kind: PersistentVolumeClaim
      name: prometheus-storage-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - FLINK_JOB_MODE=shock  # Use shock detection mode in production
      - LOG_LEVEL=info

images:
  - name: supply-chain-gateway
    newTag: v1.0.0
  - name: supply-chain-enrichment
    newTag: v1.0.0
  - name: supply-chain-flink-processor
    newTag: v1.0.0
