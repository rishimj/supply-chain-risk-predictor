---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: supply-chain-risk
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      name: postgres
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: supply-chain-risk
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - scrisk_user
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - scrisk_user
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: supply-chain-risk
data:
  01-create-tables.sql: |
    -- Create alerts table
    CREATE TABLE IF NOT EXISTS alerts (
        id SERIAL PRIMARY KEY,
        alert_id VARCHAR(255) UNIQUE NOT NULL,
        company_name VARCHAR(255) NOT NULL,
        risk_score FLOAT NOT NULL,
        article_count INTEGER NOT NULL,
        window_start TIMESTAMP NOT NULL,
        window_end TIMESTAMP NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        metadata JSONB
    );

    CREATE INDEX IF NOT EXISTS idx_alerts_company_time ON alerts(company_name, window_start DESC);
    CREATE INDEX IF NOT EXISTS idx_alerts_risk_score ON alerts(risk_score DESC);
    CREATE INDEX IF NOT EXISTS idx_alerts_created_at ON alerts(created_at DESC);

    -- Create company_mentions table for historical tracking
    CREATE TABLE IF NOT EXISTS company_mentions (
        id SERIAL PRIMARY KEY,
        company_name VARCHAR(255) NOT NULL,
        article_id VARCHAR(255) NOT NULL,
        title TEXT,
        sentiment FLOAT,
        published TIMESTAMP,
        processed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(company_name, article_id)
    );

    CREATE INDEX IF NOT EXISTS idx_mentions_company_time ON company_mentions(company_name, published DESC);
    CREATE INDEX IF NOT EXISTS idx_mentions_sentiment ON company_mentions(sentiment);
