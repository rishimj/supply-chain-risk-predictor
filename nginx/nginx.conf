events {
    worker_connections 1024;
}

http {
    upstream enrichment_cluster {
        # Use least_conn for better distribution under varying load
        least_conn;
        
        # Three enrichment service instances
        server enrichment-1:8082 max_fails=3 fail_timeout=30s;
        server enrichment-2:8082 max_fails=3 fail_timeout=30s;
        server enrichment-3:8082 max_fails=3 fail_timeout=30s;
        
        # Keep connections alive for better performance
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        
        # Access logging for debugging
        access_log /var/log/nginx/access.log combined;
        error_log /var/log/nginx/error.log warn;
        
        # Health check endpoint for the load balancer itself
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "nginx load balancer healthy\n";
        }
        
        # Load balancer status page
        location /nginx_status {
            stub_status on;
            access_log off;
        }
        
        # Proxy to enrichment cluster
        location /v1/enrich {
            proxy_pass http://enrichment_cluster;
            
            # Retry on next upstream if current fails
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Also proxy health checks to enrichment instances
        location /healthz/enrichment {
            proxy_pass http://enrichment_cluster/healthz;
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}

